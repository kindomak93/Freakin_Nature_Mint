services:

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile

    container_name: freakin-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: freakin_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freakin_db"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: freakin-api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    # environment:
    #   DATABASE_URL: postgresql://postgres:postgres@postgres:5432/freakin_db

    ports:
      - "5000:5000"

    volumes:
      - ./prisma:/app/prisma

volumes:
  postgres_data: